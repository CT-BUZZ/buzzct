<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Connecticut Buzz">
  <defs>
    <path id="ctbArc" d="M28 88 A 74 74 0 0 1 172 88" fill="none"/>
  </defs>
  <!-- badge: gold border + navy field + inner gold keyline -->
  <polygon points="100,6 181.4,53 181.4,147 100,194 18.6,147 18.6,53" fill="#D9A441"/>
  <polygon points="100,16 172.7,58 172.7,142 100,184 27.3,142 27.3,58" fill="#003366"/>
  <polygon points="100,22 167.5,61 167.5,139 100,178 32.5,139 32.5,61" fill="none" stroke="#D9A441" stroke-width="2.4"/>
  <!-- arched wordmark -->
  <text font-family="'Oswald','Arial Narrow',sans-serif" font-weight="700" font-size="17" letter-spacing="0.5" fill="#F7FAFF" text-anchor="middle">
    <textPath href="#ctbArc" startOffset="50%">CONNECTICUT</textPath>
  </text>
  <!-- bee -->
  <g fill="#D9A441">
    <!-- antennae -->
    <path d="M94 70 C88 60 84 56 80 52" stroke="#D9A441" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M106 70 C112 60 116 56 120 52" stroke="#D9A441" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <circle cx="79" cy="51" r="3.2"/>
    <circle cx="121" cy="51" r="3.2"/>
    <!-- wings -->
    <g opacity="0.92">
      <ellipse cx="70" cy="92" rx="27" ry="15" transform="rotate(-22 70 92)"/>
      <ellipse cx="130" cy="92" rx="27" ry="15" transform="rotate(22 130 92)"/>
    </g>
    <!-- head -->
    <circle cx="100" cy="74" r="11"/>
    <!-- thorax + abdomen -->
    <ellipse cx="100" cy="98" rx="17" ry="14"/>
    <path d="M84 104 C84 126 92 146 100 152 C108 146 116 126 116 104 Z"/>
  </g>
  <!-- abdomen stripes -->
  <g stroke="#003366" stroke-width="3.4" stroke-linecap="round">
    <path d="M86 112 H114"/>
    <path d="M88 124 H112"/>
    <path d="M91 136 H109"/>
  </g>
  <!-- CT state silhouette on thorax -->
  <path d="M89 94 L110 93 L110.5 99 L108 99.5 L108 102 L99 103 L98.5 105.5 L96 105 L96.2 102.5 L89.5 102.8 Z" fill="#F7FAFF"/>
  <!-- BUZZ banner -->
  <text x="100" y="172" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="700" font-size="26" letter-spacing="2" fill="#F7FAFF" text-anchor="middle">BUZZ</text>
</svg>
